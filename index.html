<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Explorer - Country Rarity Quiz 🌍</title>
    <!-- Leaflet CSS for interactive map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); 
            color: #f5f6fa; 
            min-height: 100vh;
        }
        h1 { 
            text-align: center; 
            margin-top: 0; 
            color: #f39c12; 
            text-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
            letter-spacing: 1.5px;
            font-size: 2.2rem;
        }
        .container { display: flex; flex-wrap: wrap; gap: 25px; max-width: 1350px; margin: 0 auto; }
        
        /* Explorer Chat Area */
        .chat-container { 
            flex: 1; 
            min-width: 380px; 
            background: linear-gradient(145deg, rgba(22, 36, 58, 0.9), rgba(15, 23, 42, 0.95)); 
            backdrop-filter: blur(12px);
            border: 2px solid #f39c12;
            border-radius: 18px; 
            padding: 22px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            display: flex; 
            flex-direction: column; 
            height: 620px; 
        }
        .chat-box { 
            flex: 1; 
            overflow-y: auto; 
            border: 1px solid rgba(41, 128, 185, 0.5); 
            border-radius: 12px; 
            padding: 16px; 
            background: rgba(10, 15, 30, 0.85); 
            margin-bottom: 15px; 
        }
        .message { margin-bottom: 14px; padding: 12px 16px; border-radius: 14px; max-width: 90%; line-height: 1.5; font-size: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.2); }
        .bot { background: #2c3e50; color: #ecf0f1; border-left: 5px solid #f39c12; margin-right: auto; }
        .user { background: linear-gradient(135deg, #d35400, #e67e22); color: white; margin-left: auto; text-align: right; }
        .input-area { display: flex; gap: 10px; }
        input { 
            flex: 1; 
            padding: 14px 18px; 
            border: 2px solid #2980b9; 
            border-radius: 30px; 
            outline: none; 
            font-size: 16px; 
            background: #0b0f19; 
            color: #fff; 
            transition: 0.3s;
        }
        input:focus { border-color: #f39c12; box-shadow: 0 0 10px rgba(243, 156, 18, 0.4); }
        button { 
            padding: 12px 26px; 
            background: linear-gradient(135deg, #d35400, #e67e22); 
            color: white; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.5);
            transition: 0.2s;
        }
        button:hover { background: linear-gradient(135deg, #e67e22, #f39c12); transform: scale(1.04); }

        /* Map Area Container & Placeholder */
        .map-container { 
            flex: 1.3; 
            min-width: 380px; 
            height: 620px; 
            border-radius: 18px; 
            overflow: hidden; 
            border: 2px solid #2980b9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            position: relative;
            background: #0b1120;
        }
        #map { width: 100%; height: 100%; background: #24527a; visibility: hidden; opacity: 0; transition: opacity 1s ease; }
        #map.visible { visibility: visible; opacity: 1; }

        .leaflet-container { cursor: default !important; }

        .map-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            background: radial-gradient(circle, rgba(22, 36, 58, 0.95) 0%, rgba(10, 15, 30, 0.98) 100%);
            z-index: 10;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .map-placeholder.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .placeholder-icon {
            font-size: 65px;
            margin-bottom: 20px;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .placeholder-title {
            font-size: 22px;
            color: #f39c12;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .placeholder-sub {
            font-size: 15px;
            color: #a0aec0;
            max-width: 320px;
            line-height: 1.5;
        }

        /* Score & Mission Board */
        .score-board { 
            text-align: center; 
            font-size: 17px; 
            margin-bottom: 15px; 
            font-weight: bold; 
            color: #f1c40f; 
            background: rgba(22, 36, 58, 0.8);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #f39c12;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            max-width: 1350px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <h1>🗺️ Global Explorer: Country Rarity Quiz</h1>
    <div class="score-board" id="scoreBoard">Status: Loading World Database...</div>

    <div class="container">
        <!-- Chat Area -->
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <div class="message bot">
                    ⏳ <b>Loading world database...</b><br>Connecting to global explorer network.
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Type here..." onkeydown="if(event.key==='Enter') processInput()">
                <button onclick="processInput()">Send</button>
            </div>
        </div>

        <!-- Map Area -->
        <div class="map-container">
            <div id="mapPlaceholder" class="map-placeholder">
                <div class="placeholder-icon">🧭</div>
                <div class="placeholder-title">Satellite Scanner Standby</div>
                <div class="placeholder-sub">The satellite view will unlock and fly into position once you submit your first correct guess!</div>
            </div>
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let countriesList = [];
        let isLoaded = false;

        let gameState = 0; 
        let totalRounds = 0;
        let currentRound = 0;
        let difficulty = null;
        let targetScore = 0;
        let totalScore = 0;
        let currentMarker = null;
        let mapRevealed = false;
        let guessedCountriesThisGame = [];

        const map = L.map('map', { 
            zoomControl: false,
            dragging: false,
            touchZoom: false,
            doubleClickZoom: false,
            scrollWheelZoom: false,
            boxZoom: false,
            keyboard: false
        }).setView([20, 0], 2);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 8,
            attribution: 'Tiles &copy; Esri'
        }).addTo(map);

        // ------------------------------------------------------------------
        // Loads all countries from two free sources (no API key needed):
        // 1) Country list (names, codes, coordinates, flags) from GitHub
        // 2) Population numbers from the World Bank
        // ------------------------------------------------------------------
        async function fetchWorldData() {
            const chatBox = document.getElementById('chatBox');

            try {
                // 1) Country list
                const countriesRes = await fetch('https://raw.githubusercontent.com/mledoze/countries/master/countries.json');
                if (!countriesRes.ok) throw new Error('Country list failed: ' + countriesRes.status);
                countriesList = await countriesRes.json();

                // 2) Population (World Bank). If this fails, the game still runs.
                try {
                    const popRes = await fetch('https://api.worldbank.org/v2/country/all/indicator/SP.POP.TOTL?format=json&per_page=400&mrnev=1');
                    if (!popRes.ok) throw new Error('Population failed: ' + popRes.status);
                    const popJson = await popRes.json();
                    const popMap = {};
                    (popJson[1] || []).forEach(e => {
                        if (e.countryiso3code && typeof e.value === 'number') {
                            popMap[e.countryiso3code] = e.value;
                        }
                    });
                    countriesList.forEach(c => {
                        if (popMap[c.cca3]) c.population = popMap[c.cca3];
                    });
                } catch (popErr) {
                    console.warn('Could not load population data:', popErr);
                }
            } catch (err) {
                console.error('Could not load country data:', err);
                chatBox.innerHTML = `
                    <div class="message bot">
                        ⚠️ <b>Could not load the country database.</b><br>
                        Please reload the page.
                    </div>`;
                document.getElementById('scoreBoard').innerText = 'Status: Error loading data';
                return;
            }

            isLoaded = true;
            document.getElementById('scoreBoard').innerText = `Status: Setup Mission | Score: 0 / Target: --`;

            chatBox.innerHTML = `
                <div class="message bot">
                    Hello Explorer! 🧭 Welcome to <b>Global Explorer: Country Rarity Quiz</b>.<br><br>
                    <b>How the game works:</b><br>
                    Your goal is to guess world countries. Highly populated or famous countries (like China or USA) grant fewer points, while smaller or lesser-known countries award huge rarity points! Reach the target score to win.<br>
                    <i>(Tip: Type <b>'cancel'</b> anytime to exit or reset, or type <b>'debug'</b> to view loaded countries)</i><br><br>
                    <b>How many rounds do you want to play?</b><br>
                    Type a number (e.g., 3, 5, or 10).
                </div>`;
        }

        fetchWorldData();

        function resetGame() {
            gameState = 0;
            totalScore = 0;
            currentRound = 0;
            mapRevealed = false;
            guessedCountriesThisGame = [];
            document.getElementById('scoreBoard').innerText = `Status: Setup Mission | Score: 0 / Target: --`;
            
            document.getElementById('mapPlaceholder').classList.remove('hidden');
            document.getElementById('map').classList.remove('visible');
            map.setView([20, 0], 2);
            if (currentMarker) map.removeLayer(currentMarker);
        }

        // ------------------------------------------------------------------
        // RARITY TIERS (hand-picked, based on how well known a country is to
        // an English-speaking audience in Austria). Easy to adjust:
        // just move a 3-letter country code into another list.
        //   15 = very common guess ... 98 = very rare guess
        // ------------------------------------------------------------------
        const RARITY_TIERS = {
            15: [
                "USA","GBR","FRA","DEU","ITA","ESP","CHN","JPN","IND","RUS","BRA","CAN","AUS","MEX","AUT","CHE"
            ],
            30: [
                "NLD","BEL","POL","CZE","SVK","SVN","HUN","HRV","GRC","TUR","PRT","SWE","NOR","DNK","FIN","IRL",
                "UKR","EGY","THA","ZAF","KOR","ARG","ISR","NZL","ARE","MCO","LIE","VAT"
            ],
            50: [
                "CHL","COL","PER","VEN","CUB","JAM","CRI","PAN","ECU","URY","DOM","BHS",
                "ROU","BGR","SRB","BIH","LUX","MLT","CYP","ISL","EST","LVA","LTU","ALB","BLR",
                "IDN","MYS","SGP","PHL","VNM","PAK","BGD","IRN","IRQ","SAU","QAT","JOR","LBN","AFG","SYR",
                "NPL","LKA","KHM","TWN","PRK","HKG","MDV","KWT","PSE","YEM",
                "MAR","TUN","KEN","NGA","DZA","TZA","ETH","LBY"
            ],
            75: [
                "BOL","PRY","GTM","HND","SLV","NIC","HTI","TTO","BRB","BLZ",
                "MKD","MNE","MDA","UNK","XKX","AND","SMR",
                "KAZ","UZB","GEO","ARM","AZE","MNG","LAO","MMR","OMN","BHR","BTN","BRN","TLS",
                "GHA","SEN","CIV","CMR","UGA","ZWE","ZMB","MOZ","AGO","MDG","NAM","BWA","RWA","SDN","SOM",
                "COD","MUS","SYC","CPV","MLI","FJI","PNG","WSM"
            ],
            98: [
                "GUY","SUR","DMA","KNA","VCT","GRD","ATG","LCA",
                "KGZ","TJK","TKM",
                "NER","BFA","MRT","TCD","ERI","DJI","COM","STP","GNB","GNQ","GAB","COG","CAF","BDI","LSO","SWZ",
                "MWI","LBR","SLE","GMB","GIN","TGO","BEN","SSD",
                "TON","VUT","SLB","KIR","TUV","NRU","PLW","MHL","FSM"
            ]
        };

        const rarityByCode = {};
        Object.entries(RARITY_TIERS).forEach(([points, codes]) => {
            codes.forEach(code => { rarityByCode[code] = Number(points); });
        });

        function calculateRarity(cca3, pop) {
            if (rarityByCode[cca3] !== undefined) return rarityByCode[cca3];

            // Countries not on any list (mostly territories): fall back to population
            if (!pop || pop < 5000000) return 98;
            return 75;
        }

        function normalizeStr(str) {
            if (!str) return "";
            return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase().trim();
        }

        function findCountry(query) {
            const cleanQuery = normalizeStr(query);
            if (!cleanQuery) return null;

            // 1. Exakter Abgleich (Common Name, Official Name, ISO Codes)
            for (let c of countriesList) {
                if (!c || !c.name) continue;
                
                const common = normalizeStr(c.name.common);
                const official = normalizeStr(c.name.official);
                const cca2 = normalizeStr(c.cca2);
                const cca3 = normalizeStr(c.cca3);

                if (common === cleanQuery || official === cleanQuery || cca2 === cleanQuery || cca3 === cleanQuery) {
                    return c;
                }

                if (c.altSpellings) {
                    for (let alt of c.altSpellings) {
                        if (normalizeStr(alt) === cleanQuery) return c;
                    }
                }
            }

            // 2. Intelligente Teilwortsuche (startsWith oder exakter Teilstring)
            if (cleanQuery.length >= 2) {
                for (let c of countriesList) {
                    if (!c || !c.name) continue;
                    const common = normalizeStr(c.name.common);
                    const official = normalizeStr(c.name.official);

                    if (common.includes(cleanQuery) || official.includes(cleanQuery)) {
                        return c;
                    }
                }
            }

            return null;
        }

        function formatCountryResult(c) {
            let lat = 0;
            let lng = 0;
            if (c.latlng && Array.isArray(c.latlng) && c.latlng.length >= 2) {
                lat = c.latlng[0];
                lng = c.latlng[1];
            } else if (c.capitalInfo && c.capitalInfo.latlng && c.capitalInfo.latlng.length >= 2) {
                lat = c.capitalInfo.latlng[0];
                lng = c.capitalInfo.latlng[1];
            }

            let pop = typeof c.population === 'number' ? c.population : 1000000;
            const countryName = c.name.common;
            const rarity = calculateRarity(c.cca3, pop);
            const flag = c.flag || "🗺️";
            
            let popFormatted = "";
            if (pop >= 1000000) {
                popFormatted = (pop / 1000000).toFixed(2) + "M";
            } else if (pop > 0) {
                popFormatted = (pop / 1000).toFixed(0) + "k";
            } else {
                popFormatted = "N/A";
            }

            return {
                commonName: countryName,
                name: `${countryName} ${flag}`,
                lat: lat,
                lng: lng,
                zoom: 5,
                rarity: rarity,
                info: `Region: ${c.region || 'World'} | Population: ${popFormatted}`
            };
        }

        function revealAndFlyTo(lat, lng, zoom, name, info, rarity) {
            const mapElem = document.getElementById('map');
            const placeholderElem = document.getElementById('mapPlaceholder');

            if (!mapRevealed) {
                placeholderElem.classList.add('hidden');
                mapElem.classList.add('visible');
                mapRevealed = true;

                setTimeout(() => {
                    map.invalidateSize();
                    map.flyTo([lat, lng], zoom, { duration: 3.0 });
                }, 300);
            } else {
                map.flyTo([lat, lng], zoom, { duration: 2.5 });
            }

            if (currentMarker) map.removeLayer(currentMarker);
            currentMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup(`<b>${name}</b><br>${info}<br>⭐ <b>Rarity: +${rarity}</b>`)
                .openPopup();
        }

        function processInput() {
            if (!isLoaded) return;

            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            if (text.toLowerCase() === 'cancel' || text.toLowerCase() === 'exit' || text.toLowerCase() === 'stop' || text.toLowerCase() === 'quit' || text.toLowerCase() === 'restart') {
                resetGame();
                setTimeout(() => {
                    chatBox.innerHTML += `<div class="message bot">🛑 <b>Game reset!</b><br><br><b>How many rounds do you want to play?</b><br>Type a number (e.g., 3, 5, or 10).</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 300);
                return;
            }

            // Debug-Befehl, um geladene Länder zu überprüfen
            if (text.toLowerCase() === 'debug') {
                const namesList = countriesList.map(c => c.name?.common).filter(Boolean).sort().join(', ');
                setTimeout(() => {
                    chatBox.innerHTML += `<div class="message bot">🛠️ <b>DEBUG INFO:</b><br>Loaded countries count: <b>${countriesList.length}</b><br><br><b>Available countries:</b> ${namesList}</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 300);
                return;
            }

            setTimeout(() => {
                let botReply = "";

                if (gameState === 0) {
                    const roundsNum = parseInt(text);
                    if (!isNaN(roundsNum) && roundsNum > 0 && roundsNum <= 20) {
                        totalRounds = roundsNum;
                        gameState = 1;
                        botReply = `🔄 <b>Rounds set to: ${totalRounds}</b>.<br><br><b>Choose Difficulty</b><br>Type <b>Easy</b>, <b>Medium</b>, or <b>Hard</b>.<br><br><i>How scoring works: Famous countries give few points, while rare countries award huge points!</i>`;
                    } else {
                        botReply = `⚠️ Please enter a valid number of rounds between 1 and 20.`;
                    }
                }
                else if (gameState === 1) {
                    const lowerText = text.toLowerCase();
                    if (lowerText.includes('eas') || lowerText.includes('med') || lowerText.includes('har')) {
                        if (lowerText.includes('eas')) difficulty = 'Easy';
                        else if (lowerText.includes('med')) difficulty = 'Medium';
                        else difficulty = 'Hard';

                        let multiplier = difficulty === 'Easy' ? 25 : (difficulty === 'Medium' ? 50 : 75);
                        targetScore = totalRounds * multiplier;
                        gameState = 2;
                        currentRound = 1;

                        botReply = `🚀 <b>Mission Configured!</b><br>Difficulty: <b>${difficulty}</b> | Rounds: <b>${totalRounds}</b><br>🎯 <b>Target Score to Pass:</b> ${targetScore} points.<br><br><b>Round 1 / ${totalRounds}</b><br>Enter your first country!`;
                        document.getElementById('scoreBoard').innerText = `Round 1/${totalRounds} | Score: 0 / Target: ${targetScore}`;
                    } else {
                        botReply = `⚠️ Please type <b>Easy</b>, <b>Medium</b>, or <b>Hard</b>.`;
                    }
                }
                else if (gameState === 2) {
                    const foundObj = findCountry(text);

                    if (foundObj) {
                        const formatted = formatCountryResult(foundObj);

                        if (guessedCountriesThisGame.includes(formatted.commonName)) {
                            botReply = `⚠️ You have already entered <b>${formatted.commonName}</b> in this game! Please choose another country.`;
                        } else {
                            guessedCountriesThisGame.push(formatted.commonName);
                            totalScore += formatted.rarity;

                            revealAndFlyTo(formatted.lat, formatted.lng, formatted.zoom, formatted.name, formatted.info, formatted.rarity);

                            botReply = `✅ <b>Discovered:</b> ${formatted.name}<br>📖 <i>${formatted.info}</i><br>⭐ <b>Points earned:</b> +${formatted.rarity}`;

                            if (currentRound >= totalRounds) {
                                gameState = 3;
                                if (totalScore >= targetScore) {
                                    botReply += `<br><br>🎉 <b>MISSION ACCOMPLISHED!</b><br>Final Score: ${totalScore} / ${targetScore}. You passed! 🏆<br><br>Type <b>'cancel'</b> to play again.`;
                                } else {
                                    botReply += `<br><br>❌ <b>Unfortunately, no more tries left!</b><br>Final Score: ${totalScore} / ${targetScore}. Target was ${targetScore}. Try picking rarer countries next time!<br><br>Type <b>'cancel'</b> to try again.`;
                                }
                                document.getElementById('scoreBoard').innerText = `Game Over | Final Score: ${totalScore} (Target: ${targetScore})`;
                            } else {
                                currentRound++;
                                botReply += `<br><br><b>Round ${currentRound} / ${totalRounds}</b><br>Type your next country.`;
                                document.getElementById('scoreBoard').innerText = `Round ${currentRound}/${totalRounds} | Score: ${totalScore} / Target: ${targetScore}`;
                            }
                        }
                    } 
                    else {
                        botReply = `❌ I couldn't find this country in my database. Please check your spelling (you are allowed to google if you are unsure about the spelling) or try another one.`;
                    }
                }
                else if (gameState === 3) {
                    botReply = `Game is finished! Type <b>'cancel'</b> to begin a new mission.`;
                }

                chatBox.innerHTML += `<div class="message bot">${botReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
