<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Explorer - Country Rarity Quiz 🌍</title>
    <!-- Leaflet CSS for interactive map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); 
            color: #f5f6fa; 
            min-height: 100vh;
        }
        h1 { 
            text-align: center; 
            margin-top: 0; 
            color: #f39c12; 
            text-shadow: 0 0 15px rgba(243, 156, 18, 0.5);
            letter-spacing: 1.5px;
            font-size: 2.2rem;
        }
        .container { display: flex; flex-wrap: wrap; gap: 25px; max-width: 1350px; margin: 0 auto; }
        
        /* Explorer Chat Area */
        .chat-container { 
            flex: 1; 
            min-width: 380px; 
            background: linear-gradient(145deg, rgba(22, 36, 58, 0.9), rgba(15, 23, 42, 0.95)); 
            backdrop-filter: blur(12px);
            border: 2px solid #f39c12;
            border-radius: 18px; 
            padding: 22px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
            display: flex; 
            flex-direction: column; 
            height: 620px; 
        }
        .chat-box { 
            flex: 1; 
            overflow-y: auto; 
            border: 1px solid rgba(41, 128, 185, 0.5); 
            border-radius: 12px; 
            padding: 16px; 
            background: rgba(10, 15, 30, 0.85); 
            margin-bottom: 15px; 
        }
        .message { margin-bottom: 14px; padding: 12px 16px; border-radius: 14px; max-width: 90%; line-height: 1.5; font-size: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.2); }
        .bot { background: #2c3e50; color: #ecf0f1; border-left: 5px solid #f39c12; margin-right: auto; }
        .user { background: linear-gradient(135deg, #d35400, #e67e22); color: white; margin-left: auto; text-align: right; }
        .input-area { display: flex; gap: 10px; }
        input { 
            flex: 1; 
            padding: 14px 18px; 
            border: 2px solid #2980b9; 
            border-radius: 30px; 
            outline: none; 
            font-size: 16px; 
            background: #0b0f19; 
            color: #fff; 
            transition: 0.3s;
        }
        input:focus { border-color: #f39c12; box-shadow: 0 0 10px rgba(243, 156, 18, 0.4); }
        button { 
            padding: 12px 26px; 
            background: linear-gradient(135deg, #d35400, #e67e22); 
            color: white; 
            border: none; 
            border-radius: 30px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(211, 84, 0, 0.5);
            transition: 0.2s;
        }
        button:hover { background: linear-gradient(135deg, #e67e22, #f39c12); transform: scale(1.04); }

        /* Interactive Map Area */
        .map-container { 
            flex: 1.3; 
            min-width: 380px; 
            height: 620px; 
            border-radius: 18px; 
            overflow: hidden; 
            border: 2px solid #2980b9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
        }
        #map { width: 100%; height: 100%; }
        
        /* Score & Mission Board */
        .score-board { 
            text-align: center; 
            font-size: 17px; 
            margin-bottom: 15px; 
            font-weight: bold; 
            color: #f1c40f; 
            background: rgba(22, 36, 58, 0.8);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #f39c12;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            max-width: 1350px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <h1>🗺️ Global Explorer: Country Rarity Quiz</h1>
    <div class="score-board" id="scoreBoard">Status: Loading World Database...</div>

    <div class="container">
        <!-- Chat Area -->
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <div class="message bot">
                    ⏳ <b>Loading world database...</b><br>Connecting to global explorer network.
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Type here..." onkeydown="if(event.key==='Enter') processInput()">
                <button onclick="processInput()">Send</button>
            </div>
        </div>

        <!-- Map Area -->
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let countriesList = [];
        let isLoaded = false;

        let gameState = 0; 
        let totalRounds = 0;
        let currentRound = 0;
        let difficulty = null;
        let targetScore = 0;
        let totalScore = 0;
        let currentMarker = null;

        const map = L.map('map').setView([30, 10], 3);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: 'Map data © OpenStreetMap'
        }).addTo(map);

        const fallbackData = [
            { name: { common: "China", official: "People's Republic of China" }, latlng: [35.86, 104.19], population: 1400000000, region: "Asia", flag: "🇨🇳" },
            { name: { common: "United States", official: "United States of America" }, latlng: [37.09, -95.71], population: 331000000, region: "Americas", flag: "🇺🇸" },
            { name: { common: "Germany", official: "Federal Republic of Germany" }, latlng: [51.16, 10.45], population: 83000000, region: "Europe", flag: "🇩🇪" },
            { name: { common: "France", official: "French Republic" }, latlng: [46.22, 2.21], population: 67000000, region: "Europe", flag: "🇫🇷" },
            { name: { common: "Italy", official: "Italian Republic" }, latlng: [41.87, 12.56], population: 60000000, region: "Europe", flag: "🇮🇹" },
            { name: { common: "Austria", official: "Republic of Austria" }, latlng: [47.51, 14.55], population: 9000000, region: "Europe", flag: "🇦🇹" },
            { name: { common: "Japan", official: "Japan" }, latlng: [36.20, 138.25], population: 125000000, region: "Asia", flag: "🇯🇵" },
            { name: { common: "Spain", official: "Kingdom of Spain" }, latlng: [40.46, -3.74], population: 47000000, region: "Europe", flag: "🇪🇸" }
        ];

        async function fetchWorldData() {
            try {
                const response = await fetch('https://restcountries.com/v3.1/all');
                if (!response.ok) throw new Error('API failed');
                countriesList = await response.json();
            } catch (err) {
                countriesList = fallbackData;
            }

            isLoaded = true;
            document.getElementById('scoreBoard').innerText = `Status: Setup Mission | Score: 0 / Target: --`;
            
            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML = `
                <div class="message bot">
                    Hello Explorer! 🧭 Welcome to <b>Global Explorer: Country Rarity Quiz</b>.<br><br>
                    <b>How the game works:</b><br>
                    Your goal is to guess world countries. Highly populated or famous countries (like China or USA) grant fewer points, while smaller or lesser-known countries award huge rarity points! Reach the target score to win.<br>
                    <i>(Tip: Type <b>'cancel'</b> anytime to exit or reset)</i><br><br>
                    <b>How many rounds do you want to play?</b><br>
                    Type a number (e.g., 3, 5, or 10).
                </div>`;
        }

        fetchWorldData();

        function resetGame() {
            gameState = 0;
            totalScore = 0;
            currentRound = 0;
            document.getElementById('scoreBoard').innerText = `Status: Setup Mission | Score: 0 / Target: --`;
            map.flyTo([30, 10], 3, { duration: 1.5 });
            if (currentMarker) map.removeLayer(currentMarker);
        }

        function calculateRarity(pop) {
            if (!pop || pop < 1) return 98;
            if (pop < 500000) return 98;
            if (pop < 5000000) return 85;
            if (pop < 20000000) return 70;
            if (pop < 60000000) return 50;
            if (pop < 150000000) return 30;
            return 15;
        }

        function findCountry(query) {
            const cleanQuery = query.toLowerCase().trim();

            for (let c of countriesList) {
                const commonName = c.name?.common?.toLowerCase() || "";
                const officialName = c.name?.official?.toLowerCase() || "";
                const altSpellings = (c.altSpellings || []).map(s => s.toLowerCase());

                if (commonName === cleanQuery || officialName === cleanQuery || altSpellings.includes(cleanQuery)) {
                    const lat = c.latlng ? c.latlng[0] : 0;
                    const lng = c.latlng ? c.latlng[1] : 0;
                    const pop = c.population || 0;
                    const rarity = calculateRarity(pop);
                    const flag = c.flag || "🗺️";

                    return {
                        name: `${c.name.common} ${flag}`,
                        lat: lat,
                        lng: lng,
                        zoom: 5,
                        rarity: rarity,
                        info: `Region: ${c.region || 'World'} | Population: ${(pop / 1000000).toFixed(2)}M`
                    };
                }
            }
            return null;
        }

        function processInput() {
            if (!isLoaded) return;

            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            chatBox.innerHTML += `<div class="message user">${text}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            if (text.toLowerCase() === 'cancel' || text.toLowerCase() === 'exit' || text.toLowerCase() === 'stop' || text.toLowerCase() === 'quit' || text.toLowerCase() === 'restart') {
                resetGame();
                setTimeout(() => {
                    chatBox.innerHTML += `<div class="message bot">🛑 <b>Game reset!</b><br><br><b>How many rounds do you want to play?</b><br>Type a number (e.g., 3, 5, or 10).</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 300);
                return;
            }

            setTimeout(() => {
                let botReply = "";

                if (gameState === 0) {
                    // Rounds Selection
                    const roundsNum = parseInt(text);
                    if (!isNaN(roundsNum) && roundsNum > 0 && roundsNum <= 20) {
                        totalRounds = roundsNum;
                        gameState = 1;
                        botReply = `🔄 <b>Rounds set to: ${totalRounds}</b>.<br><br><b>Choose Difficulty</b><br>Type <b>Easy</b>, <b>Medium</b>, or <b>Hard</b>.<br><br><i>How scoring works: Famous countries give few points (15-30), while rare countries award huge points (70-98)!</i>`;
                    } else {
                        botReply = `⚠️ Please enter a valid number of rounds between 1 and 20.`;
                    }
                }
                else if (gameState === 1) {
                    // Difficulty Selection
                    const lowerText = text.toLowerCase();
                    if (lowerText.includes('eas') || lowerText.includes('med') || lowerText.includes('har')) {
                        if (lowerText.includes('eas')) difficulty = 'Easy';
                        else if (lowerText.includes('med')) difficulty = 'Medium';
                        else difficulty = 'Hard';

                        let multiplier = difficulty === 'Easy' ? 25 : (difficulty === 'Medium' ? 50 : 75);
                        targetScore = totalRounds * multiplier;
                        gameState = 2;
                        currentRound = 1;

                        botReply = `🚀 <b>Mission Configured!</b><br>Difficulty: <b>${difficulty}</b> | Rounds: <b>${totalRounds}</b><br>🎯 <b>Target Score to Pass:</b> ${targetScore} points.<br><br><b>Round 1 / ${totalRounds}</b><br>Enter your first country!`;
                        document.getElementById('scoreBoard').innerText = `Round 1/${totalRounds} | Score: 0 / Target: ${targetScore}`;
                    } else {
                        botReply = `⚠️ Please type <b>Easy</b>, <b>Medium</b>, or <b>Hard</b>.`;
                    }
                }
                else if (gameState === 2) {
                    // Playing Game Rounds
                    const item = findCountry(text);

                    if (item) {
                        totalScore += item.rarity;

                        map.flyTo([item.lat, item.lng], item.zoom, { duration: 2.5 });
                        if (currentMarker) map.removeLayer(currentMarker);
                        currentMarker = L.marker([item.lat, item.lng]).addTo(map)
                            .bindPopup(`<b>${item.name}</b><br>${item.info}<br>⭐ <b>Rarity: +${item.rarity}</b>`)
                            .openPopup();

                        botReply = `✅ <b>Discovered:</b> ${item.name}<br>📖 <i>${item.info}</i><br>⭐ <b>Points earned:</b> +${item.rarity}`;

                        if (currentRound >= totalRounds) {
                            gameState = 3;
                            if (totalScore >= targetScore) {
                                botReply += `<br><br>🎉 <b>MISSION ACCOMPLISHED!</b><br>Final Score: ${totalScore} / ${targetScore}. You passed! 🏆<br><br>Type <b>'cancel'</b> to play again.`;
                            } else {
                                botReply += `<br><br>❌ <b>Leider keine Versuche mehr!</b><br>Final Score: ${totalScore} / ${targetScore}. Target was ${targetScore}. Try picking rarer countries next time!<br><br>Type <b>'cancel'</b> to try again.`;
                            }
                            document.getElementById('scoreBoard').innerText = `Game Over | Final Score: ${totalScore} (Target: ${targetScore})`;
                        } else {
                            currentRound++;
                            botReply += `<br><br><b>Round ${currentRound} / ${totalRounds}</b><br>Type your next country.`;
                            document.getElementById('scoreBoard').innerText = `Round ${currentRound}/${totalRounds} | Score: ${totalScore} / Target: ${targetScore}`;
                        }
                    } 
                    else {
                        botReply = `❌ I couldn't find this country in my database. Please check your spelling (you are allowed to google if you are unsure about the spelling) or try another one.`;
                    }
                }
                else if (gameState === 3) {
                    botReply = `Game is finished! Type <b>'cancel'</b> to begin a new mission.`;
                }

                chatBox.innerHTML += `<div class="message bot">${botReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }
    </script>
</body>
</html>
