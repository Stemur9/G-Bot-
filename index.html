<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo-Guess-Bot 🌍</title>
    <!-- Leaflet CSS für die interaktive Karte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #1a1a2e; color: #fff; }
        h1 { text-align: center; margin-top: 0; color: #4eacc5; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: 0 auto; }
        
        /* Links: Der Chatbereich */
        .chat-container { flex: 1; min-width: 320px; background: #16213e; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); display: flex; flex-direction: column; height: 550px; }
        .chat-box { flex: 1; overflow-y: auto; border: 1px solid #0f3460; border-radius: 8px; padding: 15px; background: #0f3460; margin-bottom: 15px; }
        .message { margin-bottom: 12px; padding: 10px 14px; border-radius: 15px; max-width: 85%; line-height: 1.4; }
        .bot { background: #1e3d59; color: #e8e8e8; margin-right: auto; }
        .user { background: #e94560; color: white; margin-left: auto; text-align: right; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 20px; outline: none; font-size: 16px; background: #1a1a2e; color: #fff; }
        button { padding: 12px 24px; background: #e94560; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #ff6b81; }

        /* Rechts: Die interaktive Karte */
        .map-container { flex: 1.2; min-width: 320px; height: 550px; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        #map { width: 100%; height: 100%; }
        
        /* Score Anzeige */
        .score-board { text-align: center; font-size: 18px; margin-bottom: 10px; font-weight: bold; color: #4eacc5; }
    </style>
</head>
<body>

    <h1>🌍 Geo-Bot: Seltenheits-Quiz</h1>
    <div class="score-board" id="scoreBoard">Punkte: 0 | Fragen beantwortet: 0</div>

    <div class="container">
        <!-- Chatbereich -->
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <div class="message bot">Anpfiff! 🧭 Ich bin dein Geo-Bot. Ich stelle dir Fragen zu Hauptstädten in Europa. Je seltener deine richtige Antwort ist, desto mehr Punkte bekommst du und wir zoomen auf der Karte zu deinem Ort! Klicke auf "Start" oder schreibe etwas.</div>
            </div>
            <div class="input-area">
                <input type="text" id="userInput" placeholder="Antwort eingeben (z. B. Vaduz)..." onkeydown="if(event.key==='Enter') processInput()">
                <button onclick="processInput()">Senden</button>
            </div>
        </div>

        <!-- Kartenbereich -->
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <!-- Leaflet JS für die Karte -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Datenbank aller europäischen Hauptstädte mit Koordinaten & Bekanntheit (Score: Je kleiner, desto seltener!)
        const capitals = {
            "paris": { name: "Paris", lat: 48.8566, lng: 2.3522, score: 10, msg: "Sehr bekannt! Ein echter Klassiker." },
            "berlin": { name: "Berlin", lat: 52.5200, lng: 13.4050, score: 10, msg: "Mainstream-Antwort, aber richtig!" },
            "rom": { name: "Rom", lat: 41.9028, lng: 12.4964, score: 15, msg: "Kennen alle, gibt kleine Punkte." },
            "london": { name: "London", lat: 51.5074, lng: -0.1278, score: 10, msg: "Sehr bekannte Antwort!" },
            "madrid": { name: "Madrid", lat: 40.4168, lng: -3.7038, score: 20, msg: "Solide Wahl." },
            "wien": { name: "Wien", lat: 48.2082, lng: 16.3738, score: 25, msg: "Schöne Stadt, mittelbekannt!" },
            "prag": { name: "Prag", lat: 50.0755, lng: 14.4378, score: 40, msg: "Gute Wahl! Schon etwas seltener." },
            "warschau": { name: "Warschau", lat: 52.2297, lng: 21.0122, score: 45, msg: "Stark! Gute Punkte gesammelt." },
            "budapest": { name: "Budapest", lat: 47.4979, lng: 19.0402, score: 40, msg: "Tolle Antwort an der Donau!" },
            "oslo": { name: "Oslo", lat: 59.9139, lng: 10.7522, score: 50, msg: "Skandinavien-Punkte!" },
            "stockholm": { name: "Stockholm", lat: 59.3293, lng: 18.0686, score: 45, msg: "Sehr gut!" },
            "kopenhagen": { name: "Kopenhagen", lat: 55.6761, lng: 12.5683, score: 45, msg: "Richtig!" },
            "helsinki": { name: "Helsinki", lat: 60.1699, lng: 24.9384, score: 55, msg: "Guter Griff im Norden!" },
            "bratislava": { name: "Bratislava", lat: 48.1486, lng: 17.1077, score: 75, msg: "GENIAL! Sehr seltene Antwort!" },
            "ljubljana": { name: "Ljubljana", lat: 46.0569, lng: 14.5058, score: 85, msg: "MEGA! Extrem hohe Seltenheit!" },
            "vaduz": { name: "Vaduz", lat: 47.1410, lng: 9.5209, score: 95, msg: "VOLLTREFFER! Super selten!" },
            "podgorica": { name: "Podgorica", lat: 42.4304, lng: 19.2594, score: 90, msg: "Wahnsinn! Das ist Nischenwissen!" },
            "chisinau": { name: "Chișinău", lat: 47.0105, lng: 28.8638, score: 95, msg: "LEGENDÄR! Höchste Punktzahl!" },
            "tallinn": { name: "Tallinn", lat: 59.4370, lng: 24.7536, score: 70, msg: "Sehr starkes Baltikum-Wissen!" },
            "riga": { name: "Riga", lat: 56.9496, lng: 24.1052, score: 65, msg: "Gute Punkte!" },
            "vilnius": { name: "Vilnius", lat: 54.6872, lng: 25.2797, score: 70, msg: "Klasse Antwort!" },
            "valletta": { name: "Valletta", lat: 35.8997, lng: 14.5148, score: 90, msg: "Insel-Bonus! Sehr selten!" },
            "san marino": { name: "San Marino", lat: 43.9424, lng: 12.4578, score: 95, msg: "Unglaublich selten!" }
        };

        // Quiz-Fragen
        const questions = [
            "Nenne eine europäische Hauptstadt, die NICHT direkt am Meer liegt.",
            "Nenne eine Hauptstadt in Osteuropa oder auf dem Balkan.",
            "Nenne eine eher kleine oder unbekannte Hauptstadt in Europa.",
            "Nenne eine Hauptstadt in Nord- oder Mitteleuropa."
        ];

        let currentQuestionIndex = 0;
        let totalScore = 0;
        let questionsAnswered = 0;
        let currentMarker = null;

        // Karte initialisieren (Zentriert auf Europa)
        const map = L.map('map').setView([50.1109, 8.6821], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        function processInput() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim().toLowerCase();

            if (!text) return;

            // Nachricht des Nutzers im Chat anzeigen
            chatBox.innerHTML += `<div class="message user">${input.value}</div>`;
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // Prcontent-Prüfung
            setTimeout(() => {
                let botReply = "";
                
                if (capitals[text]) {
                    const city = capitals[text];
                    totalScore += city.score;
                    questionsAnswered++;
                    
                    // Karte animieren und zoomen!
                    map.flyTo([city.lat, city.lng], 10, { duration: 2 });
                    
                    if (currentMarker) map.removeLayer(currentMarker);
                    currentMarker = L.marker([city.lat, city.lng]).addTo(map)
                        .bindPopup(`<b>${city.name}</b><br>Seltenheits-Bonus: +${city.score} Punkte!`)
                        .openPopup();

                    botReply = `<b>Richtig!</b> 🎯 ${city.msg}<br>📍 <b>Stadt:</b> ${city.name}<br>⭐ <b>Seltenheits-Punkte:</b> +${city.score}`;
                    
                    // Nächste Frage vorbereiten
                    currentQuestionIndex = (currentQuestionIndex + 1) % questions.length;
                    botReply += `<br><br><b>Nächste Frage:</b> ${questions[currentQuestionIndex]}`;
                } else {
                    botReply = `❌ Diese Stadt kenne ich nicht oder sie gehört nicht zu unserer Europaliste. Versuche es mit einer anderen Hauptstadt!`;
                }

                chatBox.innerHTML += `<div class="message bot">${botReply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;

                // Scoreboard aktualisieren
                document.getElementById('scoreBoard').innerText = `Punkte: ${totalScore} | Fragen beantwortet: ${questionsAnswered}`;
            }, 500);
        }
    </script>
</body>
</html>
